name: scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan sources
        run: python scanner/run.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      - name: Commit results
        run: |
          git config user.name "lead-radar-bot"
          git config user.email "lead-radar-bot@users.noreply.github.com"
          git add docs/leads.json docs/status.json data/seen.json
          if ! git diff --staged --quiet; then
            git commit -m "scan $(date -u +%FT%TZ)"
            git pull --rebase
            git push
          fi
