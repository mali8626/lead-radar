<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Radar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="pulse" id="pulse"></span>Lead Radar</div>
  <div class="meta" id="meta">Loading…</div>
  <button class="icon-btn" id="bell" aria-label="Notifications" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    <span class="badge" id="badge" hidden>0</span>
  </button>
</header>

<section class="panel" id="panel" hidden>
  <div class="panel-head">
    <strong>Notifications</strong>
    <button class="link" id="markSeen">Mark all as seen</button>
  </div>
  <ul class="notif-list" id="notifList"></ul>
  <div class="panel-opts">
    <label><input type="checkbox" id="soundOpt"> Sound on new leads</label>
    <button class="link" id="desktopOpt">Enable desktop alerts</button>
  </div>
  <details class="health">
    <summary>Source health</summary>
    <ul id="health"></ul>
  </details>
</section>

<main>
  <nav class="tabs" id="tabs" role="tablist"></nav>

  <section class="controls">
    <input type="search" id="q" placeholder="Search title, text, author…" aria-label="Search">
    <select id="source" aria-label="Source"><option value="">All sources</option></select>
    <label class="score-filter">Min score <output id="minOut">0</output>
      <input type="range" id="min" min="0" max="100" step="5" value="0"></label>
    <select id="sort" aria-label="Sort">
      <option value="found">Newest found</option>
      <option value="score">Highest score</option>
    </select>
  </section>

  <div id="list" class="list"></div>
  <p class="empty" id="empty" hidden></p>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
